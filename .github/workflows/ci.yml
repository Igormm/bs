name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        # tools the test suite exercises (see lib/data/dataprocessor.sh, core/calc.sh)
        run: sudo apt-get update && sudo apt-get install -y bc libxml2-utils python3-yaml
      - name: Bash syntax validation
        run: bash tests/validatesyntax.sh
      - name: ShellCheck validation
        run: bash tests/validateshellcheck.sh
      - name: Docs code snippet validation
        # 13 known intentional findings (migration docs, BOSA legacy README) —
        # gate after cleanup
        run: bash tests/validatedocscode.sh || true
      - name: Full test suite
        run: bash tests/runalltests.sh